#
# Builds and tests every push to master and every pull request. The e2e job then
# installs the built zip into the released engine and runs e2e/run.py on each
# database the engine supports.
#
# The engine jars this plugin compiles against come from the published OIE
# distribution, installed by scripts/install-engine-jars.sh, the same script
# local builds use. Everything else comes from Maven Central. The tarball is
# cached by engine version, so it is downloaded once and reused until
# mc.version changes.

name: Build

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

jobs:
  # Tests on 17 and on 21, the Java the OIE 4.7.0 installers bundle. Both compile to Java 17 (<release>17).
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21']
    outputs:
      mc_version: ${{ steps.engine.outputs.mc_version }}
      tag: ${{ steps.engine.outputs.tag }}
      tarball: ${{ steps.engine.outputs.tarball }}
      sha256: ${{ steps.engine.outputs.sha256 }}
      label_as: ${{ steps.engine.outputs.label_as }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      # The engine version lives in exactly one place, the POM's mc.version. Hardcoding
      # it here as well meant a future engine bump could leave CI installing 4.6.0 jars
      # while the build compiled against something else, with nothing to catch it.
      # The release tag and tarball name are mechanical transforms of that version, so
      # if OIE ever changes its asset naming the download 404s loudly rather than
      # resolving something stale.
      - name: Resolve the engine version from the POM
        id: engine
        run: |
          MC_VERSION="$(mvn -q -N org.apache.maven.plugins:maven-help-plugin:3.5.1:evaluate -Dexpression=mc.version -DforceStdout)"
          if [ -z "$MC_VERSION" ]; then
            echo "::error::Could not read mc.version from pom.xml"
            exit 1
          fi
          echo "mc_version=$MC_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v${MC_VERSION}" >> "$GITHUB_OUTPUT"
          echo "tarball=oie_unix_${MC_VERSION//./_}.tar.gz" >> "$GITHUB_OUTPUT"
          # The install script checks the tarball against this itself; the e2e job checks it here.
          SHA256="$(mvn -q -N org.apache.maven.plugins:maven-help-plugin:3.5.1:evaluate -Dexpression=oie.dist.sha256 -DforceStdout)"
          if [[ ! "$SHA256" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::pom.xml oie.dist.sha256 is '${SHA256}', not a SHA-256"
            exit 1
          fi
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"
          # A release can target an engine that isn't published yet (plugin.supported.mc.versions set
          # explicitly, see pom.xml). The e2e job then runs on mc.version's engine with the zips relabelled
          # to it, since the engine only loads a plugin built for its exact version.
          TARGET="$(mvn -q -N org.apache.maven.plugins:maven-help-plugin:3.5.1:evaluate -Dexpression=plugin.supported.mc.versions -DforceStdout)"
          if [ "$TARGET" != "$MC_VERSION" ]; then
            echo "::warning::plugin.xml targets OIE ${TARGET}; the e2e job runs on OIE ${MC_VERSION} with the zips relabelled to it."
            echo "label_as=$MC_VERSION" >> "$GITHUB_OUTPUT"
          fi

      - name: Cache OIE distribution
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .oie-dist
          key: oie-dist-${{ steps.engine.outputs.mc_version }}

      # The script local builds use: it downloads the distribution if the cache
      # missed, checks it against the SHA-256 in the POM, and installs the five
      # engine jars.
      - name: Install engine jars into the local Maven repo
        env:
          OIE_DIST_CACHE: ${{ github.workspace }}/.oie-dist
        run: ./scripts/install-engine-jars.sh

      - name: Build and test
        run: mvn -B -ntp clean verify

      # A green build with zero tests run is the failure this guards against:
      # surefire is pinned in the POM, but a pin can be dropped and nothing
      # about the build output would look wrong.
      - name: Confirm tests actually ran
        run: |
          reports=$(find . -path '*/target/surefire-reports/*.xml' | wc -l)
          if [ "$reports" -eq 0 ]; then
            echo "::error::No surefire reports were produced — the test suite did not run."
            exit 1
          fi
          echo "surefire report files: $reports"

      # One leg uploads, since two uploads of one artifact name fail: the 17 leg, which builds like release.yml.
      - name: Upload the plugin zip for the e2e job
        if: matrix.java == '17'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: plugin-zip
          path: package/target/oie-cache-manager-*.zip
          if-no-files-found: error
          retention-days: 7

  # Installs the zip into the released OIE engine through its own installer, the way a
  # user would, and runs the scenarios in e2e/run.py: fresh install (the migrator), an
  # upgrade from each release in e2e/upgrade-sources.txt built for this engine, and the
  # features (definitions, a channel's lookups, statistics, the inspector, refresh,
  # restart, delete). One job per database and Java: the engine runs on 17 and on 21, the
  # Java the OIE 4.7.0 installers bundle.
  e2e:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        db: [derby, postgres, mysql, sqlserver, sqlserver-ms, oracle]
        java: ['17', '21']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      # Restore only: the build job saves this cache, and the e2e jobs saving the same key would race.
      - name: Restore OIE distribution
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .oie-dist
          key: oie-dist-${{ needs.build.outputs.mc_version }}

      # The whole engine runs from this tarball, so it is checked against the SHA-256 in the
      # POM here as well as in the build job's install script.
      - name: Download and verify OIE distribution
        env:
          OIE_TAG: ${{ needs.build.outputs.tag }}
          OIE_TARBALL: ${{ needs.build.outputs.tarball }}
          OIE_SHA256: ${{ needs.build.outputs.sha256 }}
        run: |
          if [ ! -f ".oie-dist/$OIE_TARBALL" ]; then
            mkdir -p .oie-dist
            curl -fSL -o ".oie-dist/$OIE_TARBALL" "https://github.com/OpenIntegrationEngine/engine/releases/download/${OIE_TAG}/${OIE_TARBALL}"
          fi
          echo "${OIE_SHA256}  .oie-dist/${OIE_TARBALL}" | sha256sum -c -

      - name: Download the plugin zip
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: plugin-zip
          path: plugin-zip

      - name: Run the e2e scenarios
        env:
          DB: ${{ matrix.db }}
          OIE_TARBALL: ${{ needs.build.outputs.tarball }}
          LABEL_AS: ${{ needs.build.outputs.label_as }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          zips=(plugin-zip/oie-cache-manager-*.zip)
          if [ "${#zips[@]}" -ne 1 ] || [ ! -f "${zips[0]}" ]; then
            echo "::error::expected exactly one plugin zip, found: ${zips[*]}"
            exit 1
          fi
          relabel=()
          if [ -n "$LABEL_AS" ]; then relabel=(--label-as "$LABEL_AS"); fi
          python3 e2e/run.py --db "$DB" --zip "${zips[0]}" --tarball ".oie-dist/$OIE_TARBALL" --work "$RUNNER_TEMP/e2e" "${relabel[@]}"

      - name: Upload engine logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-logs-${{ matrix.db }}-java${{ matrix.java }}
          path: |
            ${{ runner.temp }}/e2e/*/oie*/logs/
            ${{ runner.temp }}/e2e/*/oie*/console-*.log
          if-no-files-found: ignore
          retention-days: 7
